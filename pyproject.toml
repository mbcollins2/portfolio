[project]
name = "portfolio"
version = "0.3.12"
description = "Portfolio site"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "ruff==0.17.5",
    "gunicorn==27.0.1",
    "flask-caching==2.5.1",
    "markdown==3.11.3",
    "python-frontmatter==1.3.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "jinja2==3.1.6",
    "Werkzeug==3.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]
